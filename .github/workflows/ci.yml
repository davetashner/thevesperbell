name: CI

# Required checks reference these job names; keep them stable (mw-e00.3, mw-e00.10):
# lint, typecheck, unit, coverage-gate, coverage-ratchet, e2e-smoke (aggregates the e2e-shard,
# e2e-audio and e2e-playthrough jobs),
# build, beads-validate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint # includes the src/sim determinism and layer-import rules
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  # The unit suite runs once, in coverage-gate below (mw-e41.2): running it here too doubled the runner
  # time for one signal. This job keeps the name branch protection requires and runs the sim perf
  # budgets, which live in vitest benchmark files (mw-e00.15 AC-6: mean step() <= 1 ms).
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm bench --reporter=verbose

  # The only job that runs the unit and integration tests (mw-e41.2); a failing test fails it.
  coverage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Per-layer thresholds from coverage-layers.json; fails naming the file and metric.
      - run: pnpm test:coverage
      # coverage-exclusions.md is the only source of exclusions and glue-layer gaps.
      - run: pnpm coverage:exclusions
      # Every content entry is exercised by a passing test (contract §3, mw-e00.18); reads the report
      # the Vitest content reporter wrote during the coverage run above.
      - run: pnpm content:coverage
      # Loot tables across the world: references, cycles and depth, unique items guaranteed once
      # (mw-e18.2); unreferenced tables are warnings.
      - run: pnpm content:loot
      # On main this is the baseline that PR ratchets download.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-summary
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 90

  coverage-ratchet:
    if: github.event_name == 'pull_request'
    needs: coverage-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          name: coverage-summary
          path: coverage
      - name: Download main's latest coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name coverage-summary --dir baseline \
              || echo "Could not download coverage from main run $run_id."
          fi
      # Falls back to the committed coverage-baseline.json with a warning annotation.
      - run: node scripts/coverage-ratchet-cli.ts

  # The chromium project runs in duration-weighted shards (mw-e41.1): e2e/shards.json holds per-spec
  # seconds and scripts/e2e-shards-cli.ts hands each shard its spec files, so no shard is much slower
  # than the rest. Playwright's own --shard split left one shard at 600-810 s beside others at 330-670 s,
  # and the slowest shard sets the PR's wall clock. Regenerate the weights with
  # `pnpm e2e:shards:regenerate <report.json>` when specs are added or change a lot; unlisted specs get
  # the median weight. The required e2e-smoke check below passes only when every e2e job does.
  e2e-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Run this shard's specs
        run: |
          files=$(node scripts/e2e-shards-cli.ts files ${{ matrix.shard }} 5)
          # An empty list would make Playwright run every spec.
          if [ -z "$files" ]; then echo "Shard ${{ matrix.shard }} has no specs."; exit 0; fi
          pnpm e2e --project=chromium $files
      # Per-spec durations for e2e/shards.json (pnpm e2e:shards:regenerate), kept on every run.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: test-results/e2e-report.json
          if-no-files-found: ignore
          retention-days: 14
      # The renderer boot smoke's first-frame screenshot, kept on every run (mw-e00.19). Only the
      # shard that runs the boot smoke has one.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-smoke-screenshot-${{ matrix.shard }}
          path: test-results/**/boot-frame.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Firefox and WebKit run the audio testbed only (mw-e28.1 AC-6; see playwright.config.ts), so they
  # get one job of their own instead of taxing every chromium shard with browser installs (mw-e41.1).
  e2e-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-firefox-webkit
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps firefox webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps firefox webkit
      # Firefox only runs an AudioContext with a sound server; the runner has no sound card, so give
      # it PulseAudio with a null sink (mw-e28.1 AC-6).
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - run: pnpm e2e --project=firefox --project=webkit
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-audio
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The slice playthrough (mw-e01.9) replays a whole run for minutes in software GL, so it gets a
  # runner to itself: beside other specs it starves their wall-clock budgets.
  e2e-playthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm e2e --project=playthrough
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-playthrough
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-smoke:
    needs: [e2e-shard, e2e-audio, e2e-playthrough]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every e2e job passed
        run: |
          test "${{ needs.e2e-shard.result }}" = success \
            && test "${{ needs.e2e-audio.result }}" = success \
            && test "${{ needs.e2e-playthrough.result }}" = success

  # The perf budget suite in CI mode (mw-e32.1; budgets in perf/perf-budgets.json, all from contract
  # §1): initial transfer and bundle size, load-to-playable and warm reload at 50 Mbps, JS heap after
  # 5 minutes idle, long tasks over 200 ms that are not frame renders (software-rendered frames are
  # long tasks themselves on these GPU-less runners, so those are only reported), plus
  # software-rendered frame time in the perf-baseline scene, compared with main's last report as a
  # warning only (AC-5). Not a required check yet.
  perf-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Every budget cites the hardware baseline verbatim (AC-6).
      - run: pnpm perf:budgets
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Writes test-results/perf-report.json and the job summary (e2e/perf/reporter.ts).
      - run: pnpm perf
      # On main this report is the baseline that PRs compare their frame time with.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-report
          path: test-results/perf-report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Download main's latest perf report
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name perf-report --dir perf-baseline \
              || echo "Could not download the perf report from main run $run_id."
          fi
      # Warning annotations only, never a failure: runner hardware varies between runs.
      - name: Frame time vs main
        if: always() && github.event_name == 'pull_request'
        run: node scripts/perf/compare-cli.ts --current test-results/perf-report.json --baseline perf-baseline/perf-report.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: perf-traces
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

  # Runs on every PR, not behind a .beads/** path filter: a required check that is skipped by a path
  # filter blocks merging, and this takes seconds.
  beads-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node scripts/validate-beads-cli.ts
